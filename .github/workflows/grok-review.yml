name: grok-review
on:
pull_request:
types: [opened, synchronize, reopened]
permissions:
contents: read
pull-requests: write
jobs:
review:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
with:
fetch-depth: 0
- name: Install Grok CLI
run: |
curl -fsSL https://x.ai/cli/install.sh | bash
echo "$HOME/.grok/bin" >> "$GITHUB_PATH"
- name: Run Grok PR review
env:
XAI_API_KEY: {{ secrets.XAI_API_KEY }}
GH_TOKEN: ${{ github.token }}
run: |
grok -p "Review PR #${{ github.event.pull_request.number }} against{{ github.base_ref }} for bugs, edge cases, and security issues, and post the review using gh." --always-approve
